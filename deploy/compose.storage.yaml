# Optional: run S3-compatible storage (RustFS) on the server itself instead of
# AWS S3 — for hosts without S3 (Oracle Cloud free tier, a VPS), and for testing
# the deploy locally. Turned on by LOCAL_STORAGE=true in .env.prod.
services:
  storage:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?LOCAL_STORAGE needs S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?LOCAL_STORAGE needs S3_SECRET_KEY}
    volumes:
      - mediadata:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    restart: unless-stopped

  api:
    environment:
      S3_ENDPOINT: storage:9000
      S3_USE_SSL: "false"
      S3_PUBLIC_URL: /storage
      S3_CREATE_BUCKET: "true"
    depends_on:
      storage:
        condition: service_healthy

  caddy:
    volumes:
      - ./storage.caddy:/etc/caddy/extra/storage.caddy:ro

volumes:
  mediadata:

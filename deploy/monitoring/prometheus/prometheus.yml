# What Prometheus scrapes, and how often. See Note 9.
global:
  scrape_interval: 15s     # every 15 s: plenty for dashboards, cheap for a micro instance
  evaluation_interval: 15s

scrape_configs:
  # The Go API's private metrics listener (METRICS_ADDR=:9090), reached by its
  # Compose service name. Caddy never routes to it.
  - job_name: api
    static_configs:
      - targets: ["api:9090"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

# Dev mode:  `make db`      → postgres + storage (services without a profile)
# Full mode: `make up-full` → postgres + api + web (the "full" profile)
name: relay

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432" # published so the API on your machine can reach it
    volumes:
      - pgdata:/var/lib/postgresql # Postgres 18 images keep data under this path
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for profile pictures (Part 2.2). RustFS stands
  # in for AWS S3: same API, so the code doesn't change. (MinIO stopped
  # publishing Docker images.)
  storage:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
    ports:
      - "${S3_PORT:-9000}:9000" # published so the API on your machine can reach it
    volumes:
      - mediadata:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: [full]
    build:
      context: ./backend
      args:
        VERSION: ${VERSION:-dev}
    environment:
      PORT: "8080"
      # Inside the Docker network, Postgres is reached by its service name, not localhost.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Storage by service name; browsers upload through Caddy's /storage route.
      S3_ENDPOINT: storage:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_PUBLIC_URL: /storage
      S3_CREATE_BUCKET: "true"
    depends_on:
      - postgres # waits for the container to start, not to be healthy — /readyz handles the gap
    healthcheck:
      test: ["CMD", "/api", "healthcheck"] # no curl in distroless, so the binary checks itself
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    # No ports: the API is only reachable through Caddy, like in production.

  web:
    profiles: [full]
    build: ./web
    ports:
      - "8000:80"
    depends_on:
      - api

volumes:
  pgdata:
  mediadata:
